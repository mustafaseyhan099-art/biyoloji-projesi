<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pancar MTAL - 3D Biyoloji Projesi</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;color:white;font-family:Arial}
#info{position:fixed;z-index:2;left:18px;top:16px}h1{margin:0;font-size:25px}
small{opacity:.75}#msg{position:fixed;z-index:2;right:18px;bottom:16px;background:#102033;padding:10px 14px;border-radius:10px}
</style>
</head>
<body>
<div id="info"><h1>PANCAR MTAL • BİYOLOJİ PROJESİ</h1><small>Gerçek 3D İnsan İskeleti</small></div>
<div id="msg">İskelet yükleniyor…</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x07111f);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.01,10000);
camera.position.set(0,1,4);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x223344,3));
const light=new THREE.DirectionalLight(0xffffff,3);light.position.set(3,5,4);scene.add(light);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
new GLTFLoader().load('./temel.glb',g=>{
 const m=g.scene;scene.add(m);
 const b=new THREE.Box3().setFromObject(m),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());
 m.position.sub(c);m.position.y+=s.y/2;
 const d=Math.max(s.x,s.y,s.z);camera.position.set(0,s.y*.5,d*1.6);controls.target.set(0,s.y*.5,0);
 camera.near=Math.max(.001,d/1000);camera.far=d*100;camera.updateProjectionMatrix();
 document.getElementById('msg').textContent='✓ İskelet yüklendi • Fareyle döndür';
},undefined,()=>document.getElementById('msg').textContent='iskelet.glb bulunamadı veya yerel sunucu gerekiyor.');
function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
